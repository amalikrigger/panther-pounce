<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0">
<title>Panther Pounce</title>
<script type="text/javascript" src="cocos2d.js"></script>
<link rel="stylesheet" type="text/css" href="css/theme.css" />
<link rel="stylesheet" type="text/css" href="style.css" />
<script defer src="js/config.js"></script>
<script defer src="js/levels/world2.js"></script>
<script defer src="js/core/events.js"></script>
<script defer src="js/render/parallax.js"></script>
<script defer src="js/render/spectators.js"></script>
<script defer src="js/fx/trajectory.js"></script>
</head>
<body>
<div id="main_div">
  <div id="frontpage_div">
    <div id="play_button">LOADING...</div>
  </div>

  <div id="level_select_div"></div>

  <!-- Who's playing? (game.js show_name_entry) -->
  <div id="name_div">
    <div class="name_title">WHO'S POUNCING?</div>
    <input id="name_input" type="text" maxlength="15" autocomplete="off" spellcheck="false" aria-label="Player name" onkeydown="if (event.key == 'Enter') submit_name();">
    <div class="pp_button name_ok" onclick="submit_name();">START</div>
    <div class="name_hint">TYPE YOUR NAME, THEN PRESS ENTER</div>
  </div>

  <!-- Level winners log (game.js show_winners) -->
  <div id="winners_div"></div>

  <div id="game_div">
    <canvas id="viewport" width="2400px" height="600px"></canvas>
    <div id="score_div"></div>
    <div id="smoke_div"></div>
    <div id="win_popup">
      <div id="win_popup_inner" class="popup_inner"></div>
      <div id="button_level_select" onclick="show_level_select();"></div>
      <div id="button_game_init" onclick="game.init();"></div>
      <div id="button_level_up" onclick="level_up();"></div>
    </div>

    <div id="lose_popup">
      <div id="lose_popup_inner" class="popup_inner"></div>
      <div id="button_level_select_2" onclick="show_level_select();"></div>
      <div id="button_game_init_2" onclick="game.init();"></div>
    </div>
  </div>

  <div id="preload_div" style="position:absolute;top:120px;left:0px;width:300px;height:250px;z-index:2;"></div>
</div>

<div id="overlay"></div>
</body>
</html>
